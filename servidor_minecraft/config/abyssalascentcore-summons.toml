#Which players a player's summons may target, for players who have not used /aa summons_target.
#ALL_PLAYERS: any player. OPPONENTS: players who are not in the summoner's team (FTB Teams party). IGNORE_PLAYERS: no players.
#Allowed Values: ALL_PLAYERS, OPPONENTS, IGNORE_PLAYERS
summonsTargetDefault = "OPPONENTS"
#A player cannot attack a summon that is not allowed to attack them: a summon that ignores a player (a teammate, or everyone, depending on its owner's /aa summons_target) cannot be hurt by that player either.
#Set to false to let players attack any summon, whether or not it may attack them back. The summon's owner is never restricted by this.
protectSummonsFromPlayersTheyIgnore = true
#Seconds a player has to wait between changes of /aa summons_target. Set to 0 for no cooldown.
#Range: 0 ~ 600
summonsTargetCooldownSeconds = 5

